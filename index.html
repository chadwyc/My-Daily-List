<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f97316"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Daily Tasks"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>My Daily Tasks</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#2a211e;background:#fff8f1}*{box-sizing:border-box}body{margin:0}main{max-width:620px;margin:auto;padding:24px 18px 90px}.hero{background:linear-gradient(135deg,#ff8a2a,#e95b08);border-radius:28px;padding:26px;color:white;box-shadow:0 14px 30px #e56b252a}.eyebrow{font-size:13px;opacity:.85;font-weight:700;letter-spacing:.08em;text-transform:uppercase}h1{margin:8px 0;font-size:32px}#date{opacity:.95}.stats{display:flex;align-items:center;justify-content:space-between;margin-top:22px}.ring{height:90px;width:90px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#fff var(--p),#ffffff55 0)}.ring span{background:#f7781b;border-radius:50%;height:68px;width:68px;display:grid;place-items:center;font-size:23px;font-weight:800}.panel{background:white;border:1px solid #f4e5d7;border-radius:22px;padding:18px;margin-top:18px;box-shadow:0 4px 14px #6333000b}.panel h2{margin:0 0 15px;font-size:20px}.add{display:flex;gap:8px}.add input{flex:1;min-width:0;padding:14px;border:1px solid #e8d8c9;border-radius:13px;font-size:16px}button{cursor:pointer} .primary{background:#f97316;border:0;border-radius:13px;color:white;font-size:22px;padding:0 18px;font-weight:bold}.task{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid #f4ede5}.task:last-child{border-bottom:0}.task input{width:23px;height:23px;accent-color:#f97316}.task .name{flex:1;overflow-wrap:anywhere}.task.done .name{text-decoration:line-through;color:#998f87}.delete{border:0;background:transparent;color:#b2a398;font-size:23px;padding:3px 8px}.sectionhead{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#aa7b55;font-weight:800;margin:18px 4px 6px}.empty{color:#9b8778;font-size:14px;padding:16px 4px}.tabs{display:flex;gap:8px;margin-top:18px}.tabs button{flex:1;padding:12px;border:1px solid #f1d8c5;background:#fff;border-radius:12px;color:#8e5a35;font-weight:700}.tabs button.active{background:#f97316;color:white;border-color:#f97316}.hidden{display:none}details{border-bottom:1px solid #f2e6dc;padding:12px 0}summary{cursor:pointer;font-weight:700}.archived{color:#75675c;margin:9px 0 0 18px;font-size:14px}footer{font-size:12px;text-align:center;color:#a28d7b;margin-top:24px}
</style></head><body><main><header class="hero"><div class="eyebrow">Make today count ✦</div><h1>My Daily Tasks</h1><div id="date"></div><div class="stats"><div><strong id="count" style="font-size:30px">0 / 0</strong><div>Tasks completed today</div></div><div class="ring" id="ring"><span id="percent">0%</span></div></div></header><nav class="tabs"><button id="todayTab" class="active">✓ Today</button><button id="historyTab">▦ History</button></nav><section id="todayView"><div class="panel"><h2>Add a task</h2><form id="form" class="add"><input id="newTask" placeholder="What needs to get done?" maxlength="300" required autocomplete="off"><button class="primary" aria-label="Add task">+</button></form></div><div class="panel"><h2>Today's checklist</h2><div class="sectionhead">To do</div><div id="pending"></div><div class="sectionhead">Completed</div><div id="completed"></div></div></section><section id="historyView" class="panel hidden"><h2>Completed days</h2><div id="history"></div></section><footer>Saved on this device · No account needed</footer></main><script>
(()=>{'use strict';const KEY='my-daily-tasks-local-v1';const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const fmt=s=>new Date(s+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.tasks)||!Array.isArray(data.archive))data={day:today(),tasks:[],archive:[]};function save(){localStorage.setItem(KEY,JSON.stringify(data))}function rollover(){const now=today();if(data.day===now)return;const finished=data.tasks.filter(t=>t.done).map(t=>({text:t.text,id:t.id}));if(finished.length)data.archive.unshift({day:data.day,tasks:finished});data.tasks=data.tasks.filter(t=>!t.done);data.day=now;save()}function make(tag,cls,content){const e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined)e.textContent=content;return e}function renderTasks(container,tasks){container.replaceChildren();if(!tasks.length){container.append(make('div','empty',container.id==='pending'?'All caught up! Add something above.':'Nothing checked off yet.'));return}for(const t of tasks){const row=make('div','task'+(t.done?' done':''));const cb=make('input');cb.type='checkbox';cb.checked=t.done;cb.setAttribute('aria-label','Complete '+t.text);cb.onchange=()=>{rollover();const x=data.tasks.find(x=>x.id===t.id);if(x)x.done=cb.checked;save();render()};const label=make('span','name',t.text);const del=make('button','delete','×');del.setAttribute('aria-label','Delete '+t.text);del.onclick=()=>{if(confirm('Delete this task?')){data.tasks=data.tasks.filter(x=>x.id!==t.id);save();render()}};row.append(cb,label,del);container.append(row)}}function render(){rollover();document.getElementById('date').textContent=fmt(data.day);let done=data.tasks.filter(t=>t.done),pending=data.tasks.filter(t=>!t.done),total=data.tasks.length,pct=total?Math.round(done.length/total*100):0;document.getElementById('count').textContent=`${done.length} / ${total}`;document.getElementById('percent').textContent=pct+'%';document.getElementById('ring').style.setProperty('--p',pct+'%');renderTasks(document.getElementById('pending'),pending);renderTasks(document.getElementById('completed'),done);const hist=document.getElementById('history');hist.replaceChildren();if(!data.archive.length)hist.append(make('div','empty','Your completed days will appear here after midnight.'));for(const a of data.archive){const det=make('details'),sum=make('summary',null,`${fmt(a.day)} · ${a.tasks.length} completed`),list=make('ul','archived');for(const t of a.tasks)list.append(make('li',null,t.text));det.append(sum,list);hist.append(det)}}document.getElementById('form').onsubmit=e=>{e.preventDefault();rollover();const input=document.getElementById('newTask'),value=input.value.trim();if(!value)return;data.tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),text:value,done:false});input.value='';save();render();input.focus()};function tab(which){document.getElementById('todayView').classList.toggle('hidden',which!=='today');document.getElementById('historyView').classList.toggle('hidden',which!=='history');document.getElementById('todayTab').classList.toggle('active',which==='today');document.getElementById('historyTab').classList.toggle('active',which==='history');render()}document.getElementById('todayTab').onclick=()=>tab('today');document.getElementById('historyTab').onclick=()=>tab('history');document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});window.addEventListener('focus',render);render();})();
</script></body></html>
